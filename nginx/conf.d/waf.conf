upstream app_upstream { server voting_web:8000; }

# Rate limiting zones - appropriate for production traffic
limit_req_zone $binary_remote_addr zone=general:10m rate=500r/m;
limit_req_zone $binary_remote_addr zone=admin:10m rate=300r/m;
limit_req_zone $binary_remote_addr zone=delegate:10m rate=300r/m;
limit_req_zone $binary_remote_addr zone=voting_strict:10m rate=2r/m;
limit_req_zone $binary_remote_addr zone=dev:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=account_email:10m rate=5r/m;

server {
  listen 80;
  server_name _;

  # Match the Flask request-body ceiling at the outermost HTTP boundary.
  client_max_body_size 64k;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: https:; font-src 'self' https://cdnjs.cloudflare.com; connect-src 'self' https://cdn.jsdelivr.net;" always;

  # Hide nginx version
  server_tokens off;

  # Admin endpoints
  location /admin/ {
    # Admin rate limiting
    limit_req zone=admin burst=50 nodelay;

    proxy_pass http://app_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }

  # Delegate endpoints (if any)
  location /delegate/ {
    # Delegate rate limiting
    limit_req zone=delegate burst=50 nodelay;

    proxy_pass http://app_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }

  # General endpoints (catch-all)
  location / {
    # General rate limiting
    limit_req zone=general burst=100 nodelay;

    proxy_pass http://app_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }

  # Enumeration-resistant account email routes still need abuse controls.
  location ~ ^/(forgot-password|resend-verification)$ {
    limit_req zone=account_email burst=5 nodelay;

    proxy_pass http://app_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }

  # Voting endpoint
  location /vote {
    # Voting rate limiting
    limit_req zone=voting_strict burst=20 nodelay;

    proxy_pass http://app_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }

  # Local Dev endpoints
  location /dev/ {
    # Disable ModSecurity for dev endpoints
    modsecurity off;

    # Dev rate limiting
    limit_req zone=dev burst=200 nodelay;

    proxy_pass http://app_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }
}
