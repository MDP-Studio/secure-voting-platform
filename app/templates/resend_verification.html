<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resend verification | SecureVote</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="sv-auth">
  <div class="sv-auth-topbar">
    <a href="{{ url_for('auth.login') }}" class="sv-brand">
      <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="SecureVote" width="28" height="28">
      SecureVote
    </a>
  </div>
  <main class="sv-auth-container">
    <section class="sv-auth-card" aria-labelledby="resend-title">
      <div class="sv-auth-info">
        <h2 id="resend-title">Resend verification</h2>
        <p>Request a replacement link for a pending account whose email address has not yet been verified.</p>
      </div>
      <div class="sv-auth-form">
        <h3>Request a new link</h3>
        <p class="sv-subtitle">For privacy, the response is the same whether an eligible account exists or not.</p>
        <form action="{{ url_for('registration.resend_verification') }}" method="post">
          <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input id="email" name="email" type="email" class="form-control" autocomplete="email" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Send verification link</button>
        </form>
        <p class="mt-3 mb-0"><a href="{{ url_for('auth.login') }}">Back to sign in</a></p>
      </div>
    </section>
  </main>
</body>
</html>
